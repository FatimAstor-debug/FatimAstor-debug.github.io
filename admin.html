<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>لوحة التحكم</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f0e6;color:#2a1f18;font:17px/1.7 Tahoma,system-ui,sans-serif}
.w{max-width:640px;margin:0 auto;padding:16px}h1{color:#8f6a24;font-size:26px;margin:8px 0 12px}h2{font-size:20px;margin:18px 0 8px}
.card{background:#fff;border:1px solid #e0d2bb;border-radius:14px;padding:14px;margin:12px 0}
label{display:block;margin:10px 0 4px;font-weight:700}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid #cdbda5;border-radius:10px;background:#fff;color:inherit}
button{font:700 17px Tahoma,sans-serif;padding:12px 20px;border-radius:999px;border:1.5px solid #8f6a24;background:#fff;color:#8f6a24;cursor:pointer}
button.p{background:#8f6a24;color:#fff}button.d{border-color:#b3392f;color:#b3392f}button:disabled{opacity:.5}
.tabs{display:flex;gap:8px;margin:10px 0}.tabs button{flex:1;padding:10px 6px;font-size:16px}.tabs button.on{background:#8f6a24;color:#fff}
#msg{position:sticky;top:0;z-index:5;padding:10px 14px;border-radius:10px;margin:8px 0;display:none;font-weight:700}
#msg.ok{display:block;background:#dff2df;color:#1c5a1c}#msg.er{display:block;background:#fbe0dd;color:#8a1f16}#msg.in{display:block;background:#fff3d6;color:#7a5a10}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.t{border:1px solid #e0d2bb;border-radius:12px;overflow:hidden;background:#fff}
.t img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#eee}.t div{display:flex;gap:6px;padding:6px}.t button{flex:1;padding:8px 4px;font-size:14px}
.row{border:1px dashed #cdbda5;border-radius:12px;padding:10px;margin:10px 0}small{color:#6f5f4e}[hidden]{display:none!important}
ol{padding-right:20px;margin:6px 0}
</style></head><body><div class="w">
<h1>لوحة تحكم فاطِم</h1><div id="msg"></div>
<div id="login" class="card"><b>ادخل المفتاح (مرة واحدة بس)</b>
<label>المفتاح السري<input id="tk" type="password" placeholder="github_pat_..." autocomplete="off"></label>
<p><button class="p" id="go">دخول</button></p>
<small>المفتاح بيتحفظ على جهازك إنت بس، ومتبعتوش لأي حد.</small></div>
<div id="app" hidden>
<div class="tabs"><button id="b1" class="on">رفع صور</button><button id="b2">صوري</button><button id="b3">الكلام</button></div>
<section id="p1"><div class="card"><label>القسم<select id="cat"></select></label>
<div id="newc" hidden><label>اسم القسم الجديد<input id="nc" placeholder="مثلاً: مجات حراري"></label></div>
<label>اختار الصور<input id="fl" type="file" accept="image/*" multiple></label>
<p><small>الصور بتتصغّر لوحدها قبل الرفع عشان الموقع يفضل سريع.</small></p>
<p><button class="p" id="up">ارفع الصور</button></p></div></section>
<section id="p2" hidden><div class="card"><label>القسم<select id="vc"></select></label></div><div class="g" id="grid"></div></section>
<section id="p3" hidden><div id="sf"></div><p><button class="p" id="sv">احفظ التغييرات</button></p></section>
<p><button id="out">خروج</button></p></div></div>
<script>
const REPO='FatimAstor-debug/FatimAstor-debug.github.io',API='https://api.github.com/repos/'+REPO+'/',$=i=>document.getElementById(i);
const LAB0={mirrors:'مرايات',trays:'صواني ودبل',stands:'ستاندات أكريليك',frames:'براويز وكتب كتاب',gifts:'مواليد وهدايا'};
let T=localStorage.getItem('gt')||'',S={},tree=[];
const enc=p=>p.split('/').map(encodeURIComponent).join('/');
function say(t,c){const m=$('msg');m.textContent=t;m.className=c||'in';if(c==='ok')setTimeout(()=>{if(m.textContent===t)m.className=''},4000)}
async function gh(m,p,b){const r=await fetch(API+p,{method:m,headers:{Authorization:'Bearer '+T,Accept:'application/vnd.github+json'},body:b?JSON.stringify(b):undefined});
 if(!r.ok){let e={};try{e=await r.json()}catch(x){}throw new Error(r.status===401?'المفتاح غلط أو انتهى':r.status===403||r.status===404?'المفتاح ملوش صلاحية على الموقع ده':(e.message||r.status))}return r.json()}
const u8=s=>btoa(unescape(encodeURIComponent(s))),d8=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
async function loadTree(){const j=await gh('GET','git/trees/main?recursive=1');tree=j.tree.filter(t=>t.type==='blob'&&/^images\/[^\/]+\/[^\/]+\.(jpe?g|png|webp)$/i.test(t.path))}
const folders=()=>[...new Set(tree.map(t=>t.path.split('/')[1]))];
const label=f=>(S.categories&&S.categories[f])||LAB0[f]||f;
async function loadSettings(){const j=await gh('GET','contents/settings.json');S=JSON.parse(d8(j.content));S._sha=j.sha}
async function saveSettings(fn){const j=await gh('GET','contents/settings.json');const o=JSON.parse(d8(j.content));fn(o);
 await gh('PUT','contents/settings.json',{message:'update settings',content:u8(JSON.stringify(o,null,1)),sha:j.sha});S=o}
function opt(sel,list,withNew){sel.innerHTML='';list.forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;sel.appendChild(o)});if(withNew){const o=document.createElement('option');o.value='__new';o.textContent='+ قسم جديد';sel.appendChild(o)}}
function fill(){const f=folders();opt($('cat'),f.map(x=>[x,label(x)]),true);opt($('vc'),f.map(x=>[x,label(x)]));draw()}
$('cat').onchange=()=>$('newc').hidden=$('cat').value!=='__new';$('vc').onchange=draw;
function tab(n){['1','2','3'].forEach(i=>{$('p'+i).hidden=i!==n;$('b'+i).classList.toggle('on',i===n)});if(n==='3')form()}
$('b1').onclick=()=>tab('1');$('b2').onclick=()=>tab('2');$('b3').onclick=()=>tab('3');
async function shrink(file){const url=URL.createObjectURL(file);const im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
 const k=Math.min(1,900/im.width,1300/im.height),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);return c.toDataURL('image/jpeg',.82).split(',')[1]}
$('up').onclick=async()=>{let cat=$('cat').value;if(cat==='__new')cat=$('nc').value.trim().replace(/[\/\\]/g,'');
 const fs=[...$('fl').files];if(!cat){say('اكتب اسم القسم','er');return}if(!fs.length){say('اختار صور الأول','er');return}
 $('up').disabled=true;let n=0;try{for(const f of fs){say('بيرفع '+(n+1)+' من '+fs.length+'...');const nm=Date.now()+'-'+n+'.jpg';
  await gh('PUT','contents/images/'+enc(cat)+'/'+nm,{message:'add photo',content:await shrink(f)});n++}
  say('تم رفع '+n+' صورة. هتظهر في الموقع بعد دقيقتين تقريبًا.','ok');$('fl').value='';await loadTree();fill()}catch(e){say('حصل خطأ بعد '+n+' صورة: '+e.message,'er')}$('up').disabled=false};
function draw(){const g=$('grid');g.innerHTML='';const f=$('vc').value;tree.filter(t=>t.path.split('/')[1]===f).sort((a,b)=>b.path.localeCompare(a.path)).forEach(t=>{
 const d=document.createElement('div');d.className='t';const i=document.createElement('img');i.src=enc(t.path);i.alt='';i.loading='lazy';d.appendChild(i);const r=document.createElement('div');
 const b1=document.createElement('button');b1.textContent='خلفية';b1.onclick=async()=>{try{say('بيحفظ...');await saveSettings(o=>o.heroImage=t.path);say('اتغيّرت الخلفية. هتظهر بعد دقيقتين.','ok')}catch(e){say(e.message,'er')}};
 const b2=document.createElement('button');b2.className='d';b2.textContent='مسح';b2.onclick=async()=>{if(!confirm('تمسح الصورة دي؟'))return;try{say('بيمسح...');await gh('DELETE','contents/'+enc(t.path),{message:'delete photo',sha:t.sha});await loadTree();fill();say('اتمسحت','ok')}catch(e){say(e.message,'er')}};
 r.appendChild(b1);r.appendChild(b2);d.appendChild(r);g.appendChild(d)})}
const SCH=[['brand','اسم البراند'],['signAr','الكلمة جوه الشريط الدهبي'],['signEn','الكلمة الإنجليزي تحت الشريط'],['tagline','الجملة الكبيرة تحت الاسم'],['subtitle','الجملة الصغيرة'],['realNote','جملة "الصور حقيقية"'],['btnGallery','زرار شوف الشغل'],['btnOrder','زرار الطلب'],['galleryTitle','عنوان المعرض'],['galleryHint','جملة تحت عنوان المعرض'],['stepsTitle','عنوان الخطوات'],['orderTitle','عنوان الطلب'],['orderHint','جملة تحت عنوان الطلب'],['sendButton','زرار إرسال الطلب'],['whatsapp','رقم الواتساب (بصيغة 20 وبعده الرقم من غير صفر)'],['phoneText','الرقم اللي بيظهر للعملاء'],['messageIntro','أول سطر في رسالة الواتساب']];
function inp(v,ph){const i=document.createElement('input');i.value=v||'';if(ph)i.placeholder=ph;return i}
function lab(t,el){const l=document.createElement('label');l.textContent=t;l.appendChild(el);return l}
let ins={},stI=[],cI={},fR=[];
function form(){const box=$('sf');box.innerHTML='';ins={};stI=[];cI={};fR=[];
 let c=document.createElement('div');c.className='card';SCH.forEach(([k,t])=>{ins[k]=inp(S[k]);c.appendChild(lab(t,ins[k]))});box.appendChild(c);
 c=document.createElement('div');c.className='card';c.innerHTML='<b>خطوات الطلب</b>';[0,1,2].forEach(i=>{const e=inp((S.steps||[])[i]);stI.push(e);c.appendChild(lab('خطوة '+(i+1),e))});box.appendChild(c);
 c=document.createElement('div');c.className='card';c.innerHTML='<b>أسماء الأقسام</b>';folders().forEach(f=>{cI[f]=inp(label(f));c.appendChild(lab(f,cI[f]))});box.appendChild(c);
 c=document.createElement('div');c.className='card';c.innerHTML='<b>خانات فورم الطلب</b><br><small>الإجباري لازم العميل يملاه. نوع "اختيارات" اكتب الاختيارات بينها فاصلة، أو سيبها فاضية لو عايز أسماء الأقسام.</small>';const fb=document.createElement('div');c.appendChild(fb);
 const add=f=>{const r=document.createElement('div');r.className='row';const o={};o.l=inp(f.label,'اسم الخانة');o.t=document.createElement('select');[['text','كلام قصير'],['tel','رقم موبايل'],['textarea','كلام طويل'],['select','اختيارات']].forEach(([v,t])=>{const x=document.createElement('option');x.value=v;x.textContent=t;o.t.appendChild(x)});o.t.value=f.type||'text';
  o.p=inp(f.placeholder,'مثال يظهر جوه الخانة (اختياري)');o.o=inp(f.options==='auto'||!f.options?'':f.options.join(','),'الاختيارات (للاختيارات بس)');
  const q=document.createElement('label');o.r=document.createElement('input');o.r.type='checkbox';o.r.style.width='auto';o.r.checked=!!f.required;q.appendChild(o.r);q.appendChild(document.createTextNode(' إجباري'));
  const x=document.createElement('button');x.className='d';x.textContent='مسح الخانة';x.onclick=()=>{r.remove();fR=fR.filter(z=>z!==o)};
  [o.l,o.t,o.p,o.o].forEach(e=>r.appendChild(e));r.appendChild(q);r.appendChild(x);fb.appendChild(r);fR.push(o)};
 (S.fields||[]).forEach(add);const ab=document.createElement('button');ab.textContent='+ زوّد خانة';ab.onclick=()=>add({label:'',type:'text'});c.appendChild(ab);box.appendChild(c)}
$('sv').onclick=async()=>{try{say('بيحفظ...');await saveSettings(o=>{SCH.forEach(([k])=>o[k]=ins[k].value.trim());o.steps=stI.map(e=>e.value.trim()).filter(Boolean);
 o.categories=Object.assign({},o.categories);Object.keys(cI).forEach(f=>{o.categories[f]=cI[f].value.trim()||f});
 o.fields=fR.filter(z=>z.l.value.trim()).map(z=>{const f={label:z.l.value.trim(),type:z.t.value};if(z.r.checked)f.required=true;if(z.p.value.trim())f.placeholder=z.p.value.trim();
  if(f.type==='select'){const l=z.o.value.split(',').map(s=>s.trim()).filter(Boolean);f.options=l.length?l:'auto'}return f})});
 say('اتحفظ. التغييرات هتظهر في الموقع بعد دقيقتين.','ok');form()}catch(e){say(e.message,'er')}};
async function start(){try{say('بيدخل...');await gh('GET','');await loadSettings();await loadTree();$('login').hidden=true;$('app').hidden=false;fill();say('تمام','ok')}catch(e){say(e.message,'er');$('login').hidden=false;$('app').hidden=true}}
$('go').onclick=()=>{T=$('tk').value.trim();if(!T){say('الصق المفتاح','er');return}localStorage.setItem('gt',T);start()};
$('out').onclick=()=>{localStorage.removeItem('gt');location.reload()};
if(T)start();
</script></body></html>
